[project]
name = "versa"
version = "0.1.0"
description = "Versa: a tutor that stops guessing. It asks a clarifying question with clickable options when a message is ambiguous, and remembers how past ambiguity was resolved."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sooraj", email = "soorajjr27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
versa = "versa.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
# archive/ holds parked code (see archive/*/README.md), never collected.
testpaths = ["tests"]
